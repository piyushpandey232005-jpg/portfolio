<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator | Piyush Pandey</title>
<link rel="stylesheet" href="style.css">
<style>
.calc-container {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 20px;
}
.calc-box {
background-color: #0a0a0a;
border: 1px solid darkred;
padding: 20px;
border-radius: 10px;
box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
width: 100%;
max-width: 350px;
}
.calc-display {
width: 100%;
height: 60px;
background-color: #050505;
color: white;
font-size: 28px;
text-align: right;
padding: 10px;
border: 1px solid #1a1a1a;
border-radius: 5px;
margin-bottom: 15px;
font-family: 'Montserrat', sans-serif;
}
.calc-buttons {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
}
.calc-buttons button {
padding: 15px;
font-size: 18px;
font-weight: bold;
border: none;
border-radius: 5px;
cursor: pointer;
background-color: #1a1a1a;
color: white;
}
.calc-buttons .operator {
color: gold;
}
.calc-buttons .equal {
background-color: darkred;
color: white;
}
</style>
</head>
<body>
<section class="calc-container">
<div class="calc-box">
<input type="text" class="calc-display" id="display" disabled placeholder="0">
<div class="calc-buttons">
<button onclick="clearDisplay()" style="color: darkred;">C</button>
<button onclick="deleteLast()" style="color: darkred;">DEL</button>
<button class="operator" onclick="appendValue('/')">/</button>
<button class="operator" onclick="appendValue('*')">*</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('-')">-</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('+')">+</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="equal" onclick="calculate()" style="grid-row: span 2;">=</button>
<button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
<button onclick="appendValue('.')">.</button>
</div>
</div>
</section>
<script>
let display = document.getElementById('display');
function appendValue(value) {
display.value += value;
}
function clearDisplay() {
display.value = '';
}
function deleteLast() {
display.value = display.value.slice(0, -1);
}
function calculate() {
try {
display.value = eval(display.value);
} catch (error) {
display.value = 'Error';
}
}
</script>
</body>
</html>
