<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator | Piyush Pandey</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', Arial, sans-serif;
}
body {
    background-color: #0a0a12;
    background-image: radial-gradient(circle at 50% 0%, rgba(180, 124, 255, 0.15) 0%, rgba(10, 10, 18, 1) 50%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    color: white;
    min-height: 100vh;
}
.calc-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}
.calc-box {
    background-color: rgba(18, 18, 30, 0.8);
    border: 1px solid #1c1c2a;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(108, 124, 255, 0.15);
    width: 100%;
    max-width: 350px;
    backdrop-filter: blur(10px);
}
.calc-display {
    width: 100%;
    height: 70px;
    background-color: transparent;
    color: #b47cff;
    font-size: 32px;
    text-align: right;
    padding: 10px;
    border: none;
    border-bottom: 2px solid #1c1c2a;
    margin-bottom: 20px;
    font-weight: 600;
    outline: none;
}
.calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
.calc-buttons button {
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border: 1px solid #1c1c2a;
    border-radius: 8px;
    cursor: pointer;
    background-color: rgba(255, 255, 255, 0.03);
    color: white;
    transition: all 0.3s ease;
}
.calc-buttons button:hover {
    background-color: rgba(180, 124, 255, 0.15);
    border-color: #b47cff;
    color: #b47cff;
    box-shadow: 0 0 15px rgba(180, 124, 255, 0.4);
}
.calc-buttons .operator {
    color: #6c7cff;
}
.calc-buttons .equal {
    background-color: #6c7cff;
    color: white;
    border: none;
}
.calc-buttons .equal:hover {
    background-color: #b47cff;
    color: white;
    box-shadow: 0 0 20px rgba(180, 124, 255, 0.8);
}
.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 24px;
    color: #88889c;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #1c1c2a;
    border-radius: 8px;
    transition: all 0.3s ease;
    background-color: rgba(18, 18, 30, 0.5);
}
.back-btn:hover {
    color: #b47cff;
    border-color: #b47cff;
    box-shadow: 0 0 15px rgba(180, 124, 255, 0.3);
}
</style>
</head>
<body>
<section class="calc-container">
<div class="calc-box">
<input type="text" class="calc-display" id="display" disabled placeholder="0">
<div class="calc-buttons">
<button onclick="clearDisplay()" style="color: #b47cff;">C</button>
<button onclick="deleteLast()" style="color: #b47cff;">DEL</button>
<button class="operator" onclick="appendValue('/')">/</button>
<button class="operator" onclick="appendValue('*')">*</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('-')">-</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('+')">+</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="equal" onclick="calculate()" style="grid-row: span 2;">=</button>
<button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
<button onclick="appendValue('.')">.</button>
</div>
</div>
<a href="index.html" class="back-btn">&larr; Back to Portfolio</a>
</section>
<script>
let display = document.getElementById('display');
function appendValue(value) {
display.value += value;
}
function clearDisplay() {
display.value = '';
}
function deleteLast() {
display.value = display.value.slice(0, -1);
}
function calculate() {
try {
display.value = eval(display.value);
} catch (error) {
display.value = 'Error';
}
}
</script>
</body>
</html>
